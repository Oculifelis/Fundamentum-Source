plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'JEI (BlameJared)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Curios is required (Oculifelis, 2026-10-25): the wings, mount and hook slots live in it. Dev runs always load it.
dependencies {
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // JEI is optional: compiled against its API only (the portal crafting category in compat/jei)
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // Jade is optional: compiled against its jar only (the jukebox progress line in compat/jade); never in the jar
    compileOnly "maven.modrinth:jade:${jade_version}"
    // TerraBlender 4.1.0.8 (Modrinth version id), only for biome/TerraBlenderRegion, which loads only when TerraBlender is installed
    compileOnly "maven.modrinth:terrablender:6e8GCrLb"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PoseStateTest builds pose clips from JSON (gson comes with Minecraft, which the test classpath does not have)
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

// Plain unit tests for code that needs no game (gradlew test); in-game checks live in Ostentum's SelfTest
tasks.named('test') {
    useJUnitPlatform()
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            jvmArgument '-Xmx3G'
            if (project.hasProperty('nofocus')) {
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Pskyshot: sky/SkyShot screenshots the fractal skies and the melt off screen, then closes
            if (project.hasProperty('skyshot')) {
                systemProperty 'fundamentum.skyshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Pcosmeticshot: cosmetic/CosmeticShot clicks through the cosmetic armour off screen, then closes
            if (project.hasProperty('cosmeticshot')) {
                systemProperty 'fundamentum.cosmeticshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Psoulfireshot: soulfire/SoulFireShot screenshots soul-burning mobs and the screen fire off screen, then closes
            if (project.hasProperty('soulfireshot')) {
                systemProperty 'fundamentum.soulfireshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Pjukeboxshot: music/client/JukeboxShot plays a jukebox off screen, checks the tracker, screenshots the Jade line, then closes
            if (project.hasProperty('jukeboxshot')) {
                systemProperty 'fundamentum.jukeboxshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
            // gradlew runServer -Pwhiptest: the in-game whip test (whip/WhipSelfTest), which stops the server when done
            if (project.hasProperty('whiptest')) {
                systemProperty 'fundamentum.whiptest', 'true'
            }
            // gradlew runServer -Pportaltest: the in-game portal crafting test (portal/PortalSelfTest) with its recipes
            if (project.hasProperty('portaltest')) {
                systemProperty 'fundamentum.portaltest', 'true'
            }
            // gradlew runServer -Pskytest: the Psychedelic Moon's config, roll, command and sky data (sky/SkySelfTest)
            if (project.hasProperty('skytest')) {
                systemProperty 'fundamentum.skytest', 'true'
            }
            // gradlew runServer -Pelementtest: the elemental interaction test (element/ElementSelfTest) with its data
            if (project.hasProperty('elementtest')) {
                systemProperty 'fundamentum.elementtest', 'true'
            }
            // gradlew runServer -Pthrowntest: the in-game thrown weapon test (thrown/ThrownSelfTest) with its data
            if (project.hasProperty('throwntest')) {
                systemProperty 'fundamentum.throwntest', 'true'
            }
            // gradlew runServer -Pshieldtest: the in-game shield test (shield/ShieldSelfTest) with its data
            if (project.hasProperty('shieldtest')) {
                systemProperty 'fundamentum.shieldtest', 'true'
            }
            // gradlew runServer -Psystemstest: status effects, armour sets, ammo and quivers, shield block events (SystemsSelfTest) with their data
            if (project.hasProperty('systemstest')) {
                systemProperty 'fundamentum.systemstest', 'true'
            }
            // gradlew runServer -Ptypestest: sentries, gauntlets, spears and the Better Combat seam (TypesSelfTest) with their data
            if (project.hasProperty('typestest')) {
                systemProperty 'fundamentum.typestest', 'true'
            }
            // gradlew runServer -Pflailtest: flails and scythes used on husks (flail/FlailSelfTest) with its data
            if (project.hasProperty('flailtest')) {
                systemProperty 'fundamentum.flailtest', 'true'
            }
            // gradlew runServer -Pbiometest (own injector) or -Pbiometest=tb (TerraBlender): the biome slice test
            // (biome/BiomeSliceSelfTest), each in its own fresh world, which stops the server when done
            // gradlew runServer -Psystems2test: bosses, loot helpers, material sets, mana bridge and HUD layers (systems2test), stops the server when done
            if (project.hasProperty('systems2test')) {
                systemProperty 'fundamentum.systems2test', 'true'
                gameDirectory = project.file('run-systems2test')
            }
            // gradlew runServer -Pporttest: the version-neutral layer (port/PortSelfTest), stops the server when done
            if (project.hasProperty('porttest')) {
                systemProperty 'fundamentum.porttest', 'true'
                gameDirectory = project.file('run-porttest')
            }
            // gradlew runServer -Pconfigtest: configs, files, datapack defaults and sync (config/ConfigSelfTest), stops the server when done
            if (project.hasProperty('configtest')) {
                systemProperty 'fundamentum.configtest', 'true'
                gameDirectory = project.file('run-configtest')
            }
            // gradlew runServer -Peventtest: ecosystem events, the loader bus and the advancement trigger (event/EventSelfTest), stops the server when done
            if (project.hasProperty('eventtest')) {
                systemProperty 'fundamentum.eventtest', 'true'
                gameDirectory = project.file('run-eventtest')
            }
            if (project.hasProperty('biometest')) {
                var biomeMode = project.property('biometest').toString() == 'tb' ? 'tb' : 'true'
                systemProperty 'fundamentum.biometest', biomeMode
                gameDirectory = project.file(biomeMode == 'tb' ? 'run-biometest-tb' : 'run-biometest')
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            curios_range           : curios_range,
            jei_range              : jei_range,
            jade_range             : jade_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// The portal test's recipes, only in -Pportaltest runs (never build a jar with -Pportaltest)
if (project.hasProperty('portaltest')) {
    sourceSets.main.resources.srcDir 'src/portaltest/resources'
}
// The sky test's plain moon and night event, only in -Pskytest runs (never build a jar with -Pskytest)
if (project.hasProperty('skytest')) {
    sourceSets.main.resources.srcDir 'src/skytest/resources'
}
// The element test's data, only in -Pelementtest runs (never build a jar with -Pelementtest)
if (project.hasProperty('elementtest')) {
    sourceSets.main.resources.srcDir 'src/elementtest/resources'
}
// The thrown weapon test's example boomerang and knife and their data, only in -Pthrowntest runs (never build a jar with -Pthrowntest)
if (project.hasProperty('throwntest')) {
    sourceSets.main.resources.srcDir 'src/throwntest/resources'
    sourceSets.main.java.srcDir 'src/throwntest/java'
    // the test's tags replace the emptied ones in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The shield test's example shields, data and art, only in -Pshieldtest runs (never build a jar with -Pshieldtest)
if (project.hasProperty('shieldtest')) {
    sourceSets.main.resources.srcDir 'src/shieldtest/resources'
    sourceSets.main.java.srcDir 'src/shieldtest/java'
}
// The systems test's example quiver and shield and its data, only in -Psystemstest runs (never build a jar with -Psystemstest)
if (project.hasProperty('systemstest')) {
    sourceSets.main.resources.srcDir 'src/systemstest/resources'
    sourceSets.main.java.srcDir 'src/systemstest/java'
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The weapon type test's data, only in -Ptypestest runs (never build a jar with -Ptypestest)
if (project.hasProperty('typestest')) {
    sourceSets.main.resources.srcDir 'src/typestest/resources'
    // the test's spear tag replaces the empty one in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The flail test's example flails and scythe and its data (a broken scythe file, a wave scythe on the iron hoe), only in -Pflailtest runs (never build a jar with -Pflailtest)
if (project.hasProperty('flailtest')) {
    sourceSets.main.resources.srcDir 'src/flailtest/resources'
    sourceSets.main.java.srcDir 'src/flailtest/java'
    // the test's tags replace the emptied ones in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The whip test's example whip (code, art and data), only in -Pwhiptest runs (never build a jar with -Pwhiptest)
if (project.hasProperty('whiptest')) {
    sourceSets.main.resources.srcDir 'src/whiptest/resources'
    sourceSets.main.java.srcDir 'src/whiptest/java'
    // the test's tags replace the emptied ones in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The systems test's code and data (bosses, loot, material sets), only in -Psystems2test runs
if (project.hasProperty('systems2test')) {
    sourceSets.main.java.srcDir 'src/systems2test/java'
    sourceSets.main.resources.srcDir 'src/systems2test/resources'
}

// The porting layer test, only in -Pporttest runs
if (project.hasProperty('porttest')) {
    sourceSets.main.java.srcDir 'src/porttest/java'
}

// The config test's code and data, only in -Pconfigtest runs
if (project.hasProperty('configtest')) {
    sourceSets.main.java.srcDir 'src/configtest/java'
    sourceSets.main.resources.srcDir 'src/configtest/resources'
}

// The event test's code and data, only in -Peventtest runs
if (project.hasProperty('eventtest')) {
    sourceSets.main.java.srcDir 'src/eventtest/java'
    sourceSets.main.resources.srcDir 'src/eventtest/resources'
}

// The biome slice test's code and data, only in -Pbiometest runs (never build a jar with -Pbiometest);
// -Pbiometest=tb also puts TerraBlender on the run classpath (-Ptbjar=<path> to use another jar)
if (project.hasProperty('biometest')) {
    sourceSets.main.java.srcDir 'src/biometest/java'
    sourceSets.main.resources.srcDir 'src/biometest/resources'
    if (project.property('biometest').toString() == 'tb') {
        dependencies {
            localRuntime files(project.findProperty('tbjar') ?: 'H:/PrismLauncher/instances/All the Magic - Arcana/minecraft/mods/TerraBlender-neoforge-1.21.1-4.1.0.8.jar')
        }
    }
}
neoForge.ideSyncTask generateModMetadata

// Mods that build on Fundamentum read it from this folder's repo/ (gradlew publish), see README.md
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_id}-neoforge"
            from components.java
        }
    }
    repositories {
        maven { url = project.findProperty('fundamentum_publish_repo') ?: 'H:/AI_MC_Modding/Fundamentum/repo' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LGPL-3.0-or-later: the licence texts and credits ship in the jar's META-INF
tasks.named('jar') {
    from([rootProject.file('../LICENSE'), rootProject.file('../COPYING'), rootProject.file('../CREDITS.md')]) {
        into 'META-INF'
    }
}
