plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'JEI (BlameJared)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Shedaniel (REI)'
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Curios is required: the wings, mount, hook, summon and quiver slots are Curios slots (slots/Slots).
dependencies {
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // KubeJS, Rhino and Better Advanced Tooltips (KubeJS 8 crashes without it), when their jars are in libs/ (taken from an
    // instance, gitignored), load in dev runs so scripts using Fundamentum's API (api/SoulFire) can be tried; never in the jar
    localRuntime fileTree('libs') { include 'kubejs-*.jar', 'rhino-*.jar', 'better-advanced-tooltips-*.jar' }
    // Recipe viewers are optional: compiled against only (recipeview/jei, recipeview/rei), never in the jar
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") { transitive = false }
    compileOnly("me.shedaniel.cloth:basic-math:${basic_math_version}") { transitive = false }
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
    // Jade is optional: compiled against its jar only (the jukebox progress line in compat/jade); never in the jar
    compileOnly "maven.modrinth:jade:${jade_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PoseStateTest builds pose clips from JSON (gson comes with Minecraft, which the test classpath does not have)
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

// Plain unit tests for code that needs no game (gradlew test); in-game checks live in Ostentum's SelfTest
tasks.named('test') {
    useJUnitPlatform()
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            jvmArgument '-Xmx3G'
            if (project.hasProperty('nofocus')) {
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Pskyshot: sky/SkyShot screenshots the fractal skies and the melt off screen, then closes
            if (project.hasProperty('skyshot')) {
                systemProperty 'fundamentum.skyshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Pcosmeticshot: cosmetic/CosmeticShot clicks through the cosmetic armour off screen, then closes
            if (project.hasProperty('cosmeticshot')) {
                systemProperty 'fundamentum.cosmeticshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Ppageshot[=shaders]: client/PageShot takes the mod page's pictures at 1920x1080 off screen, in its own run-pageshot folder
            if (project.hasProperty('pageshot')) {
                systemProperty 'fundamentum.pageshot', project.property('pageshot').toString()
                systemProperty 'fundamentum.nofocus', 'true'
                gameDirectory = project.file('run-pageshot')
                programArguments.addAll('--width', '1920', '--height', '1080')
            }
            // gradlew runClient -Psoulfireshot: soulfire/SoulFireShot screenshots soul-burning mobs and the screen fire off screen, then closes
            if (project.hasProperty('soulfireshot')) {
                systemProperty 'fundamentum.soulfireshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Pshieldshot -Pshieldtest: shield/ShieldShot shows the example shields blocking, parrying and bashing off screen, then closes
            if (project.hasProperty('shieldshot')) {
                systemProperty 'fundamentum.shieldshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
            // gradlew runClient -Pjukeboxshot: music/client/JukeboxShot plays a jukebox off screen, checks the tracker, screenshots the Jade line, then closes
            if (project.hasProperty('jukeboxshot')) {
                systemProperty 'fundamentum.jukeboxshot', 'true'
                systemProperty 'fundamentum.nofocus', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
            // gradlew runServer -Pwhiptest: the in-game whip test (whip/WhipSelfTest), which stops the server when done
            if (project.hasProperty('whiptest')) {
                systemProperty 'fundamentum.whiptest', 'true'
            }
            // gradlew runServer -Pportaltest: the in-game portal crafting test (portal/PortalSelfTest) with its recipes
            if (project.hasProperty('portaltest')) {
                systemProperty 'fundamentum.portaltest', 'true'
            }
            // gradlew runServer -Pskytest: the Psychedelic Moon's config, roll, command and sky data (sky/SkySelfTest)
            if (project.hasProperty('skytest')) {
                systemProperty 'fundamentum.skytest', 'true'
            }
            // gradlew runServer -Pelementtest: the elemental interaction test (element/ElementSelfTest) with its data
            if (project.hasProperty('elementtest')) {
                systemProperty 'fundamentum.elementtest', 'true'
            }
            // gradlew runServer -Pthrowntest: the in-game thrown weapon test (thrown/ThrownSelfTest) with its data
            if (project.hasProperty('throwntest')) {
                systemProperty 'fundamentum.throwntest', 'true'
            }
            // gradlew runServer -Pshieldtest: the in-game shield test (shield/ShieldSelfTest) with its data
            if (project.hasProperty('shieldtest')) {
                systemProperty 'fundamentum.shieldtest', 'true'
            }
            // gradlew runServer -Psystemstest: status effects, armour sets, ammo and quivers, shield block events (SystemsSelfTest) with their data
            if (project.hasProperty('systemstest')) {
                systemProperty 'fundamentum.systemstest', 'true'
            }
            // gradlew runServer -Ptypestest: sentries, gauntlets, spears and the Better Combat seam (TypesSelfTest) with their data
            if (project.hasProperty('typestest')) {
                systemProperty 'fundamentum.typestest', 'true'
            }
            // gradlew runServer -Pflailtest: flails and scythes used on husks (flail/FlailSelfTest) with its data
            if (project.hasProperty('flailtest')) {
                systemProperty 'fundamentum.flailtest', 'true'
            }
            // gradlew runServer -Pbiometest (own injector) or -Pbiometest=tb (TerraBlender): the biome slice test
            // (biome/BiomeSliceSelfTest), each in its own fresh world, which stops the server when done
            // gradlew runServer -Psystems2test: bosses, loot helpers, material sets, mana bridge and HUD layers (systems2test), stops the server when done
            if (project.hasProperty('systems2test')) {
                systemProperty 'fundamentum.systems2test', 'true'
                gameDirectory = project.file('run-systems2test')
            }
            // gradlew runServer -Pporttest: the version-neutral layer (port/PortSelfTest), stops the server when done
            if (project.hasProperty('porttest')) {
                systemProperty 'fundamentum.porttest', 'true'
                gameDirectory = project.file('run-porttest')
            }
            // gradlew runServer -Pconfigtest: configs, files, datapack defaults and sync (config/ConfigSelfTest), stops the server when done
            if (project.hasProperty('configtest')) {
                systemProperty 'fundamentum.configtest', 'true'
                gameDirectory = project.file('run-configtest')
            }
            // gradlew runServer -Peventtest: ecosystem events, the loader bus and the advancement trigger (event/EventSelfTest), stops the server when done
            if (project.hasProperty('eventtest')) {
                systemProperty 'fundamentum.eventtest', 'true'
                gameDirectory = project.file('run-eventtest')
            }
            // gradlew runServer -Punlocktest: unlocks, teams, grant sources, conditions and the command (unlock/UnlockSelfTest), stops the server when done
            if (project.hasProperty('unlocktest')) {
                systemProperty 'fundamentum.unlocktest', 'true'
                gameDirectory = project.file('run-unlocktest')
            }
            // gradlew runServer -Pstattest: stats, their sources, items, entities and the command (stat/StatSelfTest), stops the server when done
            if (project.hasProperty('stattest')) {
                systemProperty 'fundamentum.stattest', 'true'
                gameDirectory = project.file('run-stattest')
            }
            // gradlew runServer -Ptransfertest: fluid and energy transfer, tanks, item-to-fluid declarations and the command (transfer/TransferSelfTest), stops the server when done
            if (project.hasProperty('transfertest')) {
                systemProperty 'fundamentum.transfertest', 'true'
                gameDirectory = project.file('run-transfertest')
            }
            // gradlew runServer -Pgoaltest: data-driven mob goals and their behaviour (MobGoalSelfTest), stops the server when done
            if (project.hasProperty('goaltest')) {
                systemProperty 'fundamentum.goaltest', 'true'
                gameDirectory = project.file('run-goaltest')
            }
            // gradlew runServer -Pclimatetest: seasons, temperature, humidity, crop growth and the commands (climate/ClimateSelfTest), stops the server when done
            if (project.hasProperty('climatetest')) {
                systemProperty 'fundamentum.climatetest', 'true'
                gameDirectory = project.file('run-climatetest')
            }
            // gradlew runServer -Pfoodtest: the food hooks, modifiers, cancelling, drinks and food groups (food/FoodSelfTest), stops the server when done
            if (project.hasProperty('foodtest')) {
                systemProperty 'fundamentum.foodtest', 'true'
                gameDirectory = project.file('run-foodtest')
            }
            // gradlew runServer -Psurvivaltest: survival meters: drain, climate, thresholds, drinking and death resets (survival/SurvivalSelfTest), stops the server when done
            if (project.hasProperty('survivaltest')) {
                systemProperty 'fundamentum.survivaltest', 'true'
                gameDirectory = project.file('run-survivaltest')
            }
            // gradlew runServer -Precipeviewtest: the recipe viewer declarations and adapters (recipeview/RecipeViewSelfTest), stops the server when done
            if (project.hasProperty('recipeviewtest')) {
                systemProperty 'fundamentum.recipeviewtest', 'true'
                gameDirectory = project.file('run-recipeviewtest')
            }
            if (project.hasProperty('relictest')) {
                systemProperty 'fundamentum.relictest', 'true'
                gameDirectory = project.file('run-relictest')
            }
            // gradlew runServer -Pslottest: the Curios slots, their events and the cosmetic armour screen
            // (slots/SlotSelfTest), stops the server when done
            if (project.hasProperty('slottest')) {
                systemProperty 'fundamentum.slottest', 'true'
                gameDirectory = project.file('run-slottest')
            }
            // gradlew runServer -Punifytest: material unification, recipes, items, containers and ores (unify/UnifySelfTest), stops the server when done
            if (project.hasProperty('unifytest')) {
                systemProperty 'fundamentum.unifytest', 'true'
                gameDirectory = project.file('run-unifytest')
            }
            // gradlew runServer -Pmultiblocktest: multiblock patterns, matching, forming and the viewer page (multiblock/MultiblockSelfTest), stops the server when done
            if (project.hasProperty('multiblocktest')) {
                systemProperty 'fundamentum.multiblocktest', 'true'
                gameDirectory = project.file('run-multiblocktest')
            }
            if (project.hasProperty('biometest')) {
                var biomeMode = project.property('biometest').toString() == 'tb' ? 'tb' : 'true'
                systemProperty 'fundamentum.biometest', biomeMode
                gameDirectory = project.file(biomeMode == 'tb' ? 'run-biometest-tb' : 'run-biometest')
            }
            // gradlew runServer -Pmusictest: music rules, boss and combat state, the client sync (music/MusicSelfTest), stops the server when done
            if (project.hasProperty('musictest')) {
                systemProperty 'fundamentum.musictest', 'true'
                gameDirectory = project.file('run-musictest')
            }
            // gradlew runServer -Pguidetest: guide pages, chapters, search and unlock gating (guide/GuideSelfTest), stops the server when done
            if (project.hasProperty('guidetest')) {
                systemProperty 'fundamentum.guidetest', 'true'
                gameDirectory = project.file('run-guidetest')
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            curios_range           : curios_range,
            jei_range              : jei_range,
            rei_range              : rei_range,
            jade_range             : jade_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
