modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="fundamentum_logo.png"
logoBlur=false
authors="Oculifelis"
credits="By Oculifelis, including all art. The whip cord code adapts Better Whips by my2167592261-cell (github.com/my2167592261-cell/Better-Whips, MIT License); none of Better Whips' art or sounds are used."
description='''
The shared groundwork under Oculifelis's mods: data tables, shared stats, creature types, use sickness, Curios slots, wings, cosmetic armor, 3D arrows, mounts, grappling hooks, summons, a mob showcase command, left-click triggers, data-driven item holds, pose clips and first-person arms, special moons, cord whips, elemental auras and reactions, portal crafting, and fractal skies.
'''

