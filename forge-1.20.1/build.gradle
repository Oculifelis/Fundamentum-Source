plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // lets mixin mods such as Curios run in the dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            jvmArgs '-Xmx3G'
            args '-mixin.config=fundamentum.mixins.json'
        }
        server {
            args '--nogui'
            // the common mixins (LivingEntityMixin, MobMixin) in dev runs too; the jar names the config in its manifest
            args '-mixin.config=fundamentum.mixins.json'
            // gradlew runServer -Pwhiptest: the in-game whip test (whip/WhipSelfTest), which stops the server when done
            if (project.hasProperty('whiptest')) {
                property 'fundamentum.whiptest', 'true'
            }
            // gradlew runServer -Pportaltest: the in-game portal crafting test (portal/PortalSelfTest) with its recipes
            if (project.hasProperty('portaltest')) {
                property 'fundamentum.portaltest', 'true'
            }
            // gradlew runServer -Pskytest: the Psychedelic Moon's config, roll, command and sky data (sky/SkySelfTest)
            if (project.hasProperty('skytest')) {
                property 'fundamentum.skytest', 'true'
            }
            // gradlew runServer -Pelementtest: the elemental interaction test (element/ElementSelfTest) with its data
            if (project.hasProperty('elementtest')) {
                property 'fundamentum.elementtest', 'true'
            }
            // gradlew runServer -Psystemstest: status effects, armour sets, ammo and quivers, shield block events (SystemsSelfTest) with their data
            if (project.hasProperty('systemstest')) {
                property 'fundamentum.systemstest', 'true'
            }
            // gradlew runServer -Ptypestest: sentries, gauntlets, spears and the Better Combat seam (TypesSelfTest) with their data
            if (project.hasProperty('typestest')) {
                property 'fundamentum.typestest', 'true'
            }
            // gradlew runServer -Pthrowntest: the thrown weapon test (thrown/ThrownSelfTest) with its example boomerang and knife
            if (project.hasProperty('throwntest')) {
                property 'fundamentum.throwntest', 'true'
            }
            // gradlew runServer -Pshieldtest: example shields blocking, parrying, bashing and thrown (shield/ShieldSelfTest)
            if (project.hasProperty('shieldtest')) {
                property 'fundamentum.shieldtest', 'true'
            }
            // gradlew runServer -Pflailtest: flails and scythes used on husks (flail/FlailSelfTest) with its data
            if (project.hasProperty('flailtest')) {
                property 'fundamentum.flailtest', 'true'
            }
            // gradlew runServer -Psystems2test: bosses, loot helpers, material sets, mana bridge and HUD layers (systems2test), stops the server when done
            if (project.hasProperty('systems2test')) {
                property 'fundamentum.systems2test', 'true'
                workingDirectory project.file('run-systems2test')
            }
            // gradlew runServer -Pporttest: the version-neutral layer (port/PortSelfTest), stops the server when done
            if (project.hasProperty('porttest')) {
                property 'fundamentum.porttest', 'true'
                workingDirectory project.file('run-porttest')
            }
            // gradlew runServer -Pconfigtest: configs, files, datapack defaults and sync (config/ConfigSelfTest), stops the server when done
            if (project.hasProperty('configtest')) {
                property 'fundamentum.configtest', 'true'
                workingDirectory project.file('run-configtest')
            }
            // gradlew runServer -Peventtest: ecosystem events, the loader bus and the advancement trigger (event/EventSelfTest), stops the server when done
            if (project.hasProperty('eventtest')) {
                property 'fundamentum.eventtest', 'true'
                workingDirectory project.file('run-eventtest')
            }
            // gradlew runServer -Punlocktest: unlocks, teams, grant sources, conditions and the command (unlock/UnlockSelfTest), stops the server when done
            if (project.hasProperty('unlocktest')) {
                property 'fundamentum.unlocktest', 'true'
                workingDirectory project.file('run-unlocktest')
            }
            // gradlew runServer -Pstattest: stats, their sources, items, entities and the command (stat/StatSelfTest), stops the server when done
            if (project.hasProperty('stattest')) {
                property 'fundamentum.stattest', 'true'
                workingDirectory project.file('run-stattest')
            }
            // gradlew runServer -Ptransfertest: fluid and energy transfer, tanks, item-to-fluid declarations and the command (transfer/TransferSelfTest), stops the server when done
            if (project.hasProperty('transfertest')) {
                property 'fundamentum.transfertest', 'true'
                workingDirectory project.file('run-transfertest')
            }
            // gradlew runServer -Pgoaltest: data-driven mob goals and their behaviour (MobGoalSelfTest), stops the server when done
            if (project.hasProperty('goaltest')) {
                property 'fundamentum.goaltest', 'true'
                workingDirectory project.file('run-goaltest')
            }
            // gradlew runServer -Pclimatetest: seasons, temperature, humidity, crop growth and the commands (climate/ClimateSelfTest), stops the server when done
            if (project.hasProperty('climatetest')) {
                property 'fundamentum.climatetest', 'true'
                workingDirectory project.file('run-climatetest')
            }
            // gradlew runServer -Pfoodtest: the food hooks, modifiers, cancelling, drinks and food groups (food/FoodSelfTest), stops the server when done
            if (project.hasProperty('foodtest')) {
                property 'fundamentum.foodtest', 'true'
                workingDirectory project.file('run-foodtest')
            }
            // gradlew runServer -Psurvivaltest: survival meters: drain, climate, thresholds, drinking and death resets (survival/SurvivalSelfTest), stops the server when done
            if (project.hasProperty('survivaltest')) {
                property 'fundamentum.survivaltest', 'true'
                workingDirectory project.file('run-survivaltest')
            }
            // gradlew runServer -Pmusictest: music rules, boss and combat state, the client sync (music/MusicSelfTest), stops the server when done
            if (project.hasProperty('musictest')) {
                property 'fundamentum.musictest', 'true'
                workingDirectory project.file('run-musictest')
            }
            // gradlew runServer -Pguidetest: guide pages, chapters, search and unlock gating (guide/GuideSelfTest), stops the server when done
            if (project.hasProperty('guidetest')) {
                property 'fundamentum.guidetest', 'true'
                workingDirectory project.file('run-guidetest')
            }
            // gradlew runServer -Precipeviewtest: the recipe viewer declarations and adapters (recipeview/RecipeViewSelfTest), stops the server when done
            if (project.hasProperty('recipeviewtest')) {
                property 'fundamentum.recipeviewtest', 'true'
                workingDirectory project.file('run-recipeviewtest')
            }
            if (project.hasProperty('relictest')) {
                property 'fundamentum.relictest', 'true'
                workingDirectory project.file('run-relictest')
            }
            // gradlew runServer -Pslottest: the Curios slots, their events and the cosmetic armour screen
            // (slots/SlotSelfTest), stops the server when done
            if (project.hasProperty('slottest')) {
                property 'fundamentum.slottest', 'true'
                workingDirectory project.file('run-slottest')
            }
            // gradlew runServer -Punifytest: material unification, recipes, items, containers and ores (unify/UnifySelfTest), stops the server when done
            if (project.hasProperty('unifytest')) {
                property 'fundamentum.unifytest', 'true'
                workingDirectory project.file('run-unifytest')
            }
            // gradlew runServer -Pmultiblocktest: multiblock patterns, matching, forming and the viewer page (multiblock/MultiblockSelfTest), stops the server when done
            if (project.hasProperty('multiblocktest')) {
                property 'fundamentum.multiblocktest', 'true'
                workingDirectory project.file('run-multiblocktest')
            }
            // gradlew runServer -Pbiometest: the biome slice test (biome/BiomeSliceSelfTest) in a fresh world, own injector;
            // -Pbiometest=tb runs it with TerraBlender on the run classpath (run-biometest-tb)
            if (project.hasProperty('biometest')) {
                property 'fundamentum.biometest', project.property('biometest') == 'tb' ? 'tb' : 'own'
                workingDirectory project.file(project.property('biometest') == 'tb' ? 'run-biometest-tb' : 'run-biometest')
            }
        }
    }
}

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'JEI (BlameJared)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Shedaniel (REI)'
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'EMI (TerraformersMC)'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Curios is required: the wings, mount, hook, summon and quiver slots are Curios slots (slots/Slots).
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    // Recipe viewers are optional: compiled against only (recipeview/jei, recipeview/rei, recipeview/emi), never in the jar
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly(fg.deobf("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}")) { transitive = false }
    compileOnly(fg.deobf("me.shedaniel:RoughlyEnoughItems-default-plugin-forge:${rei_version}")) { transitive = false }
    compileOnly(fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")) { transitive = false }
    compileOnly(fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")) { transitive = false }
    compileOnly("me.shedaniel.cloth:basic-math:${basic_math_version}") { transitive = false }
    compileOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.emi:emi-forge:${emi_version}:api")) { transitive = false }
    // Jade is optional: compiled against its jar only (the jukebox progress line in compat/jade); never in the jar
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    // TerraBlender is optional: biome slices register a region subclass when it is loaded (biome/TerraBlenderRegion); never in the jar
    compileOnly fg.deobf("maven.modrinth:terrablender:zGconCHG")
    if (project.findProperty('biometest') == 'tb') runtimeOnly fg.deobf("maven.modrinth:terrablender:zGconCHG")
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PoseStateTest builds pose clips from JSON (gson comes with Minecraft, which the test classpath does not have)
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

// Plain unit tests for code that needs no game (gradlew test)
tasks.named('test') {
    useJUnitPlatform()
}

// The self-tests' data, only in their runs (never build a jar with -Pportaltest, -Pskytest or -Pelementtest)
if (project.hasProperty('portaltest')) {
    sourceSets.main.resources.srcDir 'src/portaltest/resources'
}
if (project.hasProperty('skytest')) {
    sourceSets.main.resources.srcDir 'src/skytest/resources'
}
if (project.hasProperty('elementtest')) {
    sourceSets.main.resources.srcDir 'src/elementtest/resources'
}
// The systems test's example quiver and shield and its data, only in -Psystemstest runs (never build a jar with -Psystemstest)
if (project.hasProperty('systemstest')) {
    sourceSets.main.resources.srcDir 'src/systemstest/resources'
    sourceSets.main.java.srcDir 'src/systemstest/java'
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The weapon type test's data, only in -Ptypestest runs (never build a jar with -Ptypestest)
if (project.hasProperty('typestest')) {
    sourceSets.main.resources.srcDir 'src/typestest/resources'
    // the test's spear tag replaces the empty one in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The thrown weapon test's example boomerang and knife (code, models and data), only in -Pthrowntest runs
if (project.hasProperty('throwntest')) {
    sourceSets.main.resources.srcDir 'src/throwntest/resources'
