tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            curios_range           : curios_range,
            jei_range              : jei_range,
            rei_range              : rei_range,
            emi_range              : emi_range,
            jade_range             : jade_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title': mod_id, 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion,
                    'MixinConfigs': 'fundamentum.mixins.json'])
    }
    finalizedBy 'reobfJar'
}

// Mods that build on Fundamentum read it from this folder's repo/ (gradlew publish), see README.md
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_id}-forge"
            artifact jar
        }
    }
    repositories {
        // -Pfundamentum_publish_repo=<dir> publishes elsewhere (a worktree's own repo/)
        maven { url = project.findProperty('fundamentum_publish_repo') ?: 'H:/AI_MC_Modding/Fundamentum/repo' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LGPL-3.0-or-later: the licence texts and credits ship in the jar's META-INF
tasks.named('jar') {
    from([rootProject.file('../LICENSE'), rootProject.file('../COPYING'), rootProject.file('../CREDITS.md')]) {
        into 'META-INF'
    }
}

// The music test's code and data, only in -Pmusictest runs
if (project.hasProperty('musictest')) {
    sourceSets.main.java.srcDir 'src/musictest/java'
    sourceSets.main.resources.srcDir 'src/musictest/resources'
}

// The guide test's code and pages, only in -Pguidetest runs
if (project.hasProperty('guidetest')) {
    sourceSets.main.java.srcDir 'src/guidetest/java'
    sourceSets.main.resources.srcDir 'src/guidetest/resources'
}

// gradlew runClient -Phudshot[=perf]: hudshot/HudPerf times the HUD layers and hudshot/HudShot walks the HUD editor, the
// guide, the multiblock views and the ghost preview off screen, muted and without taking the mouse, saving screenshots in
// run-hudshot, then closes. Test runs only: never build a jar with -Phudshot.
if (project.hasProperty('hudshot')) {
    sourceSets.main.java.srcDir 'src/hudshot/java'
    ['hudshot', 'guidetest', 'multiblocktest', 'stattest', 'survivaltest'].each { sourceSets.main.resources.srcDir "src/${it}/resources" }
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    minecraft.runs.client {
        property 'fundamentum.hudshot', project.property('hudshot').toString() ?: 'true'
        property 'fundamentum.nofocus', 'true'
        workingDirectory project.file('run-hudshot')
        // the test-only mixin that keeps the cursor free is named only in this run
        args '-mixin.config=fundamentum-hudshot.mixins.json'
    }
}
