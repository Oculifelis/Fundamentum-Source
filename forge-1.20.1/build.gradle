plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // lets mixin mods such as Curios run in the dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            jvmArgs '-Xmx3G'
            args '-mixin.config=fundamentum.mixins.json'
        }
        server {
            args '--nogui'
            // the common mixins (LivingEntityMixin, MobMixin) in dev runs too; the jar names the config in its manifest
            args '-mixin.config=fundamentum.mixins.json'
            // gradlew runServer -Pwhiptest: the in-game whip test (whip/WhipSelfTest), which stops the server when done
            if (project.hasProperty('whiptest')) {
                property 'fundamentum.whiptest', 'true'
            }
            // gradlew runServer -Pportaltest: the in-game portal crafting test (portal/PortalSelfTest) with its recipes
            if (project.hasProperty('portaltest')) {
                property 'fundamentum.portaltest', 'true'
            }
            // gradlew runServer -Pskytest: the Psychedelic Moon's config, roll, command and sky data (sky/SkySelfTest)
            if (project.hasProperty('skytest')) {
                property 'fundamentum.skytest', 'true'
            }
            // gradlew runServer -Pelementtest: the elemental interaction test (element/ElementSelfTest) with its data
            if (project.hasProperty('elementtest')) {
                property 'fundamentum.elementtest', 'true'
            }
            // gradlew runServer -Ptypestest: sentries, gauntlets, spears and the Better Combat seam (TypesSelfTest) with their data
            if (project.hasProperty('typestest')) {
                property 'fundamentum.typestest', 'true'
            }
            // gradlew runServer -Pthrowntest: the thrown weapon test (thrown/ThrownSelfTest) with its example boomerang and knife
            if (project.hasProperty('throwntest')) {
                property 'fundamentum.throwntest', 'true'
            }
            // gradlew runServer -Pshieldtest: example shields blocking, parrying, bashing and thrown (shield/ShieldSelfTest)
            if (project.hasProperty('shieldtest')) {
                property 'fundamentum.shieldtest', 'true'
            }
            // gradlew runServer -Pflailtest: flails and scythes used on husks (flail/FlailSelfTest) with its data
            if (project.hasProperty('flailtest')) {
                property 'fundamentum.flailtest', 'true'
            }
            // gradlew runServer -Pbiometest: the biome slice test (biome/BiomeSliceSelfTest) in a fresh world, own injector;
            // -Pbiometest=tb runs it with TerraBlender on the run classpath (run-biometest-tb)
            if (project.hasProperty('biometest')) {
                property 'fundamentum.biometest', project.property('biometest') == 'tb' ? 'tb' : 'own'
                workingDirectory project.file(project.property('biometest') == 'tb' ? 'run-biometest-tb' : 'run-biometest')
            }
        }
    }
}

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'JEI (BlameJared)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Curios is required (Oculifelis, 2026-10-25): the wings, mount and hook slots live in it. Dev runs always load it.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    // JEI is optional: compiled against its API only (the portal crafting category in compat/jei)
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // Jade is optional: compiled against its jar only (the jukebox progress line in compat/jade); never in the jar
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    // TerraBlender is optional: biome slices register a region subclass when it is loaded (biome/TerraBlenderRegion); never in the jar
    compileOnly fg.deobf("maven.modrinth:terrablender:zGconCHG")
    if (project.findProperty('biometest') == 'tb') runtimeOnly fg.deobf("maven.modrinth:terrablender:zGconCHG")
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PoseStateTest builds pose clips from JSON (gson comes with Minecraft, which the test classpath does not have)
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

// Plain unit tests for code that needs no game (gradlew test)
tasks.named('test') {
    useJUnitPlatform()
}

// The self-tests' data, only in their runs (never build a jar with -Pportaltest, -Pskytest or -Pelementtest)
if (project.hasProperty('portaltest')) {
    sourceSets.main.resources.srcDir 'src/portaltest/resources'
}
if (project.hasProperty('skytest')) {
    sourceSets.main.resources.srcDir 'src/skytest/resources'
}
if (project.hasProperty('elementtest')) {
    sourceSets.main.resources.srcDir 'src/elementtest/resources'
}
// The weapon type test's data, only in -Ptypestest runs (never build a jar with -Ptypestest)
if (project.hasProperty('typestest')) {
    sourceSets.main.resources.srcDir 'src/typestest/resources'
    // the test's spear tag replaces the empty one in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The thrown weapon test's example boomerang and knife (code, models and data), only in -Pthrowntest runs
if (project.hasProperty('throwntest')) {
    sourceSets.main.resources.srcDir 'src/throwntest/resources'
    sourceSets.main.java.srcDir 'src/throwntest/java'
    // the test's thrown tags replace the empty ones in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The shield test's example shields (code, models, textures and data), only in -Pshieldtest runs
if (project.hasProperty('shieldtest')) {
    sourceSets.main.resources.srcDir 'src/shieldtest/resources'
    sourceSets.main.java.srcDir 'src/shieldtest/java'
}
if (project.hasProperty('flailtest')) {
    sourceSets.main.resources.srcDir 'src/flailtest/resources'
    sourceSets.main.java.srcDir 'src/flailtest/java'
    // the test's tags replace the emptied ones in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}
// The biome slice test's code and data, only in -Pbiometest runs (never build a jar with -Pbiometest)
if (project.hasProperty('biometest')) {
    sourceSets.main.resources.srcDir 'src/biometest/resources'
    sourceSets.main.java.srcDir 'src/biometest/java'
}
// The whip test's example whip (code, art and data), only in -Pwhiptest runs (never build a jar with -Pwhiptest)
if (project.hasProperty('whiptest')) {
    sourceSets.main.resources.srcDir 'src/whiptest/resources'
    sourceSets.main.java.srcDir 'src/whiptest/java'
    // the test's tags replace the emptied ones in main (the test folder comes last, so its copy wins)
    tasks.named('processResources').configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            curios_range           : curios_range,
            jei_range              : jei_range,
            jade_range             : jade_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title': mod_id, 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion,
                    'MixinConfigs': 'fundamentum.mixins.json'])
    }
    finalizedBy 'reobfJar'
}

// Mods that build on Fundamentum read it from this folder's repo/ (gradlew publish), see README.md
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_id}-forge"
            artifact jar
        }
    }
    repositories {
        // -Pfundamentum_publish_repo=<dir> publishes elsewhere (a worktree's own repo/)
        maven { url = project.findProperty('fundamentum_publish_repo') ?: 'H:/AI_MC_Modding/Fundamentum/repo' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LGPL-3.0-or-later: the licence texts and credits ship in the jar's META-INF
tasks.named('jar') {
    from([rootProject.file('../LICENSE'), rootProject.file('../COPYING'), rootProject.file('../CREDITS.md')]) {
        into 'META-INF'
    }
}
